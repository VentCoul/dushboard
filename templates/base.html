<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Дашборд{% endblock %}</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/htmx.org@2.0.3"></script>
  <style>
    :root {
      --bg:       #000000;
      --bg2:      #1c1c1e;
      --bg3:      #2c2c2e;
      --bg4:      #3a3a3c;
      --label:    #ffffff;
      --label2:   rgba(235,235,245,0.6);
      --label3:   rgba(235,235,245,0.3);
      --sep:      rgba(84,84,88,0.45);
      --blue:     #0a84ff;
      --green:    #30d158;
      --orange:   #ff9f0a;
      --red:      #ff453a;
      --purple:   #bf5af2;
      --teal:     #5ac8fa;
      --r-sm:     10px;
      --r-md:     14px;
      --r-lg:     20px;
      --r-xl:     28px;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html { background: var(--bg); }
    body {
      background: var(--bg);
      color: var(--label);
      font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Helvetica Neue', sans-serif;
      font-size: 15px;
      line-height: 1.5;
      min-height: 100vh;
    }

    /* Nav */
    .nav {
      position: sticky; top: 0; z-index: 100;
      background: rgba(28,28,30,0.72);
      backdrop-filter: saturate(180%) blur(20px);
      -webkit-backdrop-filter: saturate(180%) blur(20px);
      border-bottom: 0.5px solid var(--sep);
    }
    .nav-inner {
      max-width: 800px; margin: 0 auto;
      padding: 0 20px;
      display: flex; align-items: center; gap: 2px;
      height: 52px; overflow-x: auto;
    }
    .nav-tab {
      display: inline-flex; align-items: center;
      padding: 6px 14px; border-radius: var(--r-sm);
      font-size: 14px; font-weight: 500; white-space: nowrap;
      color: var(--label2);
      text-decoration: none;
      transition: background 0.18s ease, color 0.18s ease;
    }
    .nav-tab:hover  { background: rgba(255,255,255,0.08); color: var(--label); }
    .nav-tab.active { background: var(--blue); color: #fff; }
    .nav-tab.out    { margin-left: auto; color: var(--label3); font-size: 13px; }
    .nav-tab.out:hover { background: transparent; color: var(--label2); }

    /* Cards */
    .card {
      background: var(--bg2);
      border-radius: var(--r-lg);
      border: 0.5px solid var(--sep);
      padding: 18px 20px;
      transition: transform 0.2s cubic-bezier(0.34,1.2,0.64,1),
                  box-shadow 0.2s ease;
    }
    .card:hover {
      transform: translateY(-1px);
      box-shadow: 0 6px 24px rgba(0,0,0,0.45);
    }
    .card h2 {
      font-size: 15px; font-weight: 600;
      color: var(--label); margin-bottom: 14px;
      letter-spacing: -0.2px;
    }

    /* Apple input */
    .a-input {
      width: 100%;
      background: var(--bg3);
      border: 0.5px solid var(--sep);
      border-radius: var(--r-sm);
      padding: 9px 13px;
      color: var(--label);
      font-size: 14px;
      font-family: inherit;
      outline: none;
      transition: border-color 0.18s;
    }
    .a-input:focus { border-color: var(--blue); }
    .a-input::placeholder { color: var(--label3); }

    select.a-input { color: var(--label2); }

    /* Apple button */
    .a-btn {
      display: inline-flex; align-items: center; justify-content: center;
      padding: 8px 16px; border-radius: var(--r-sm);
      font-size: 14px; font-weight: 600;
      border: none; cursor: pointer;
      transition: opacity 0.15s, transform 0.15s cubic-bezier(0.34,1.2,0.64,1);
      font-family: inherit;
    }
    .a-btn:active { transform: scale(0.96); }
    .a-btn-blue   { background: var(--blue);   color: #fff; }
    .a-btn-green  { background: var(--green);  color: #000; }
    .a-btn-ghost  { background: var(--bg3);    color: var(--label2); }
    .a-btn-ghost:hover { background: var(--bg4); }
    .a-btn-red    { background: rgba(255,69,58,0.18); color: var(--red); }
    .a-btn-sm     { padding: 5px 11px; font-size: 12px; border-radius: 8px; }

    /* Status badges */
    .s-badge {
      display: inline-block;
      padding: 3px 10px; border-radius: 20px;
      font-size: 12px; font-weight: 500; white-space: nowrap;
    }
    .apple-badge-gray   { background: var(--bg4);              color: var(--label2); }
    .apple-badge-blue   { background: rgba(10,132,255,0.22);   color: var(--blue);   }
    .apple-badge-purple { background: rgba(191,90,242,0.22);   color: var(--purple); }
    .apple-badge-orange { background: rgba(255,159,10,0.22);   color: var(--orange); }
    .apple-badge-green  { background: rgba(48,209,88,0.22);    color: var(--green);  }
    .apple-badge-red    { background: rgba(255,69,58,0.18);    color: var(--red);    }

    /* Chip filter */
    .chip {
      display: inline-flex; align-items: center;
      padding: 5px 13px; border-radius: 20px;
      font-size: 13px; font-weight: 500; white-space: nowrap;
      border: 0.5px solid var(--sep);
      color: var(--label2); text-decoration: none;
      transition: all 0.16s ease;
    }
    .chip:hover { background: var(--bg3); color: var(--label); }
    .chip.active-chip { background: var(--blue); color: #fff; border-color: transparent; }

    /* Checkbox */
    .a-check {
      appearance: none; -webkit-appearance: none;
      width: 18px; height: 18px; border-radius: 50%;
      border: 1.5px solid var(--sep);
      background: transparent;
      cursor: pointer; flex-shrink: 0; margin-top: 1px;
      transition: background 0.18s, border-color 0.18s;
      position: relative;
    }
    .a-check:checked {
      background: var(--blue); border-color: var(--blue);
    }
    .a-check:checked::after {
      content: '';
      position: absolute; left: 4px; top: 2px;
      width: 6px; height: 9px;
      border-right: 2px solid #fff; border-bottom: 2px solid #fff;
      transform: rotate(45deg);
    }
    .a-check.green:checked  { background: var(--green); border-color: var(--green); }

    /* Separator */
    .sep { height: 0.5px; background: var(--sep); margin: 12px 0; }

    /* Hint text */
    .hint { color: var(--label3); font-size: 13px; }

    /* Slide-in animation for HTMX swaps */
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(6px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    .htmx-settling { animation: fadeUp 0.22s cubic-bezier(0.25,0.46,0.45,0.94) forwards; }

    /* Main layout */
    .main { max-width: 800px; margin: 0 auto; padding: 24px 20px 48px; }
  </style>
</head>
<body>
  <nav class="nav">
    <div class="nav-inner">
      {% set tab = active_tab|default('') %}
      <a href="/"          class="nav-tab {{ 'active' if tab=='productivity' }}">✅ Продуктивність</a>
      <a href="/widgets/"  class="nav-tab {{ 'active' if tab=='widgets' }}">📊 Віджети</a>
      <a href="/jobs/"     class="nav-tab {{ 'active' if tab=='jobs' }}">💼 Робота</a>
      <a href="/monitoring/" class="nav-tab {{ 'active' if tab=='monitoring' }}">🖥 Моніторинг</a>
      <a href="/ai/"       class="nav-tab {{ 'active' if tab=='ai' }}">🤖 AI</a>
      <a href="/logout"    class="nav-tab out">Вийти</a>
    </div>
  </nav>
  <main class="main">
    {% block content %}{% endblock %}
  </main>
</body>
</html>
