<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Вхід — Дашборд</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>body{background:#0b0f17;color:#e5e7eb;}</style>
</head>
<body class="min-h-screen flex items-center justify-center px-4">
  <form method="post" class="w-full max-w-xs space-y-4 p-6 rounded-xl border border-gray-800 bg-[#141b27]">
    <h1 class="text-lg font-semibold">🔐 Дашборд</h1>
    {% with messages = get_flashed_messages() %}
      {% if messages %}<p class="text-red-400 text-sm">{{ messages[0] }}</p>{% endif %}
    {% endwith %}
    <input type="password" name="password" placeholder="Пароль" autofocus
           class="w-full px-3 py-2 rounded-lg bg-[#0b0f17] border border-gray-700 focus:border-blue-500 outline-none">
    <button class="w-full py-2 rounded-lg bg-blue-600 hover:bg-blue-500 font-medium">Увійти</button>
  </form>
</body>
</html>
